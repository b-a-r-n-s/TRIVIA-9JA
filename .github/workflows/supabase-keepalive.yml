name: Keep Trivia 9ja Supabase active

on:
  schedule:
    # Three database requests daily; independent of visits to the website.
    - cron: '17 5,13,21 * * *'
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/supabase-keepalive.yml'

permissions:
  contents: read

concurrency:
  group: trivia9ja-supabase-keepalive
  cancel-in-progress: false

jobs:
  database-activity:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Execute read-only database ping
        env:
          # Publishable (browser-safe) key; never put a secret/service_role key here.
          SUPABASE_URL: https://dejytcpjuwfnyddvdwik.supabase.co
          SUPABASE_PUBLISHABLE_KEY: sb_publishable_9Ylr2cYinLFlB9SVzL9yIg_SyFw7spA
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl --fail-with-body --silent --show-error --retry 2 \
            --retry-delay 5 --connect-timeout 10 --max-time 30 \
            -H "apikey: ${SUPABASE_PUBLISHABLE_KEY}" \
            -H "Accept: application/json" \
            "${SUPABASE_URL}/rest/v1/rpc/trivia_keepalive")"
          if [[ "${response}" != "1" ]]; then
            echo "Unexpected Supabase RPC response: ${response}"
            exit 1
          fi
          echo "Supabase database query succeeded."
